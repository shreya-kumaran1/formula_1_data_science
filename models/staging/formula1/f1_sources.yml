version: 2

sources:
  - name: formula1
    description: formula 1 datasets with normalized tables
    database: formula1
    schema: raw
    config:
      freshness:
        warn_after:
          count: 30
          period: day
        error_after:
          count: 90
          period: day
    tables:
      - name: circuits
        description: One record per circuit, which is the specific race course.
        columns:
          - name: circuitid
            data_tests:
              - unique
              - not_null
      - name: constructors
        description: One record per constructor. Constructors are the teams that build their formula 1 cars.
        columns:
          - name: constructorid
            data_tests:
              - unique
              - not_null
      - name: drivers
        description: One record per driver. This table gives details about the driver.
        columns:
          - name: driverid
            data_tests:
              - unique
              - not_null
      - name: lap_times
        description: One row per lap in each race. Lap times started being recorded in this dataset in 1984 and joined through driver_id.
      - name: pit_stops
        description: One row per pit stop. Pit stops do not have their own id column, the combination of the race_id and driver_id identify the pit stop.
        columns:
          - name: stop
            data_tests:
              - not_null
      - name: races
        description: One race per row. Importantly this table contains the race year to understand trends.
        columns:
          - name: raceid
            data_tests:
              - unique
              - not_null
      - name: results
        description: One row per result. The main table that we join out for grid and position variables.
        columns:
          - name: resultid
            data_tests:
              - unique
              - not_null
      - name: status
        description: One status per row. The status contextualizes whether the race was finished or what issues arose e.g. collisions, engine, etc.
        columns:
          - name: statusid
            data_tests:
              - unique
              - not_null

models:
  - name: stg_circuits
    columns:
      - name: circuit_id
        tests:
          - unique
          - not_null

  - name: stg_constructors
    columns:
      - name: constructor_id
        tests:
          - unique
          - not_null

  - name: stg_drivers
    columns:
      - name: driver_id
        tests:
          - unique
          - not_null

  - name: stg_lap_times
    columns:
      - name: lap_times_id
        tests:
          - unique
          - not_null

  - name: stg_pit_stops
    columns:
      - name: pitstop_id
        tests:
          - unique
          - not_null

  - name: stg_races
    columns:
      - name: race_id
        tests:
          - unique
          - not_null

  - name: stg_results
    columns:
      - name: result_id
        tests:
          - unique
          - not_null

  - name: stg_status
    columns:
      - name: status_id
        tests:
          - unique
          - not_null
