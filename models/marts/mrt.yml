version: 2

models:
  - name: mrt_results
    description: '{{ doc("int_results") }}'
    columns:
      - name: result_id
        tests:
          - unique
          - not_null

  - name: mrt_pit_stops
    description: '{{ doc("int_pit_stops") }}'
    columns:
      - name: race_id
        tests:
          - not_null
      - name: driver_id
        tests:
          - not_null

  - name: mrt_lap_times_years
    description: '{{ doc("int_lap_times_years") }}'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - race_id
              - driver_id
              - lap
    columns:
      - name: race_year
        tests:
          - not_null
      - name: lap
        tests:
          - not_null

  - name: mrt_results_circuits
    description: Results enriched with circuit attributes and total pit stops per race.
    columns:
      - name: result_id
        tests:
          - unique
          - not_null
